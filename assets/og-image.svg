  <line x1="80" y1="500" x2="1120" y2="500" stroke="#262626" stroke-width="1"/>

  <text x="80" y="548" fill="#8B949E" font-family="Helvetica, Arial, sans-serif" font-size="22">Analizamos cómo funciona realmente tu operación y cuantificamos dónde se pierde tiempo, dinero y capacidad.</text>

